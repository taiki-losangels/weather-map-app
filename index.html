<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天気✕地図 連携アプリ（APIキー不要版）</title>
    <!-- 地図ライブラリ (Leaflet) のCSS -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #fdfdfd; }
        #map { height: 400px; width: 100%; border-radius: 8px; margin-top: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .info-box { background: #eef5ff; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #007bff; }
        h1 { font-size: 1.5rem; color: #333; }
    </style>
</head>
<body>

    <h1>東京の天気と地図</h1>
    <div class="info-box">
        <h3>現在の天気予報</h3>
        <p id="weather-text">データを読み込み中...</p>
    </div>
    <div id="map"></div>

    <!-- 地図ライブラリ (Leaflet) のJavaScript -->
    <script src="https://unpkg.com"></script>
    
    <script>
        const lat = 35.6895;
        const lon = 139.6917;
        const map = L.map('map').setView([lat, lon], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        const weatherUrl = 'https://jma.go.jp';
        fetch(weatherUrl)
            .then(response => {
                if (!response.ok) throw new Error('天気データの取得に失敗しました');
                return response.json();
            })
            .then(data => {
                // 気象庁の複雑なデータ構造から、今日の天気とエリア名を取り出す
                const areaName = data[0].publishingOffice; // 気象庁名義
                const targetArea = data[0].timeSeries[0].areas[0].area.name; // 「東京地方」
                const weatherReport = data[0].timeSeries[0].areas[0].weathers[0]; // 天気内容（晴れ、曇りなど）
                document.getElementById('weather-text').innerHTML = 
                    `<strong>${targetArea}</strong>の予報：<b>${weatherReport}</b><br><small>（データ元：${areaName}）</small>`;
                L.marker([lat, lon]).addTo(map)
                    .bindPopup(`<b>${targetArea}</b><br>${weatherReport}`)
                    .openPopup();
            })
            .catch(error => {
                document.getElementById('weather-text').innerText = '天気の取得エラー: ' + error.message;
                console.error(error);
            });
    </script>
</body>
</html>
